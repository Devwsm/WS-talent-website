name: Test & Deploy Production

# Setiap push ke branch main: jalankan tes, lalu (bila lulus) deploy ke hosting lewat SSH.
# Bisa juga dijalankan manual dari tab Actions (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Satu deploy pada satu waktu; deploy berikutnya menunggu, tidak saling menimpa.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Token bawaan GitHub hanya boleh membaca isi repo (prinsip hak akses minimum).
permissions:
  contents: read

jobs:
  test:
    name: Tes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, exif, gd, bcmath, fileinfo, pdo_sqlite, sqlite3
          coverage: none

      - name: Pasang dependensi PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      # Tampilan memakai @vite, jadi tes halaman butuh public/build/manifest.json (folder ini tidak ada di repo).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build aset (Vite)
        run: |
          npm ci
          npm run build

      # Folder runtime Laravel tidak ikut di git (isinya di-ignore), padahal Blade butuh storage/framework/views.
      - name: Siapkan folder storage
        run: |
          mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/logs bootstrap/cache
          chmod -R 775 storage bootstrap/cache

      # Cek kerentanan dependensi. Sengaja tidak memblokir deploy (continue-on-error): advis baru bisa muncul kapan
      # saja dan tidak boleh mengunci perbaikan darurat; hasilnya tampil sebagai peringatan di tab Actions.
      - name: Audit dependensi (composer dan npm)
        continue-on-error: true
        run: |
          # Tiap pemeriksaan dijalankan sendiri-sendiri (dulu yang pertama gagal menghentikan yang kedua) dan hasilnya
          # ditulis sebagai peringatan kuning yang menyebut alatnya. Tidak memblokir deploy.
          set +e
          composer audit --locked --no-dev --abandoned=report
          hasil_composer=$?
          npm audit --omit=dev --audit-level=high
          hasil_npm=$?
          echo "composer audit: exit $hasil_composer | npm audit: exit $hasil_npm"
          if [ "$hasil_composer" -ne 0 ]; then echo "::warning title=Audit Composer::composer audit menemukan kerentanan pada paket PHP produksi. Buka log langkah ini."; fi
          if [ "$hasil_npm" -ne 0 ]; then echo "::warning title=Audit npm::npm audit menemukan kerentanan tingkat tinggi pada paket JS produksi. Buka log langkah ini."; fi
          exit 0

      # phpunit.xml sudah memaku semua env tes (sqlite memori), jadi tidak perlu file .env.
      - name: Jalankan tes
        run: vendor/bin/phpunit

  deploy:
    name: Deploy ke hosting
    needs: test
    runs-on: ubuntu-24.04
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      APP_PATH: ${{ secrets.APP_PATH }} # folder Laravel di server, mis. /home/whim4521/laravel
      PUBLIC_PATH: ${{ secrets.PUBLIC_PATH }} # folder web publik, mis. /home/whim4521/public_html
      PHP_BIN: ${{ vars.PHP_BIN || 'php' }} # opsional: path PHP 8.4 di server
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }} # opsional tapi disarankan: hasil `ssh-keyscan -p PORT HOST` yang kamu cek sendiri
      SITE_URL: ${{ vars.SITE_URL }} # opsional: alamat situs (mis. https://contoh.com) untuk cek otomatis setelah deploy
      DEPLOY_ID: ${{ github.run_id }}-${{ github.run_attempt }} # penanda cadangan milik deploy ini
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, exif, gd, bcmath, fileinfo, pdo_mysql
          coverage: none

      # Build dilakukan di sini, bukan di hosting: vendor/ dan public/build/ dikirim jadi.
      - name: Pasang dependensi PHP (tanpa paket dev)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build aset (Vite)
        run: |
          npm ci
          npm run build

      - name: Siapkan SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Sidik jari server dipaku dari secret bila ada. Tanpa itu, ssh-keyscan memercayai jawaban pertama (rawan dicegat).
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' >> ~/.ssh/known_hosts

            # Pemeriksaan dini supaya salah isi secret langsung jelas, bukan baru gagal di tengah dengan pesan umum.
            # 1) Harus ada entri untuk host dan port yang dipakai deploy (port selain 22 ditulis [host]:port).
            if [ "$SSH_PORT" = "22" ]; then NAMA_ENTRI="$SSH_HOST"; else NAMA_ENTRI="[$SSH_HOST]:$SSH_PORT"; fi
            if ! ssh-keygen -F "$NAMA_ENTRI" -f ~/.ssh/known_hosts > /dev/null 2>&1; then
              echo "::error::Secret SSH_KNOWN_HOSTS tidak memuat entri untuk $NAMA_ENTRI. Buat ulang dengan: ssh-keyscan -p $SSH_PORT $SSH_HOST"
              echo "Sidik jari yang ada di secret:"
              ssh-keygen -lf ~/.ssh/known_hosts || true
              exit 1
            fi
            # 2) Minimal satu kunci di secret harus sama dengan kunci server saat ini. Sidik jari bersifat publik, aman ditampilkan.
            SIDIK_SECRET=$(ssh-keygen -lf ~/.ssh/known_hosts 2>/dev/null | awk '{print $2}' | sort -u) || true
            SIDIK_SERVER=$(ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" 2>/dev/null | ssh-keygen -lf - 2>/dev/null | awk '{print $2}' | sort -u) || true
            if [ -z "$SIDIK_SERVER" ]; then
              echo "::warning::Kunci server tidak bisa dibaca dari GitHub untuk dibandingkan (port ditutup firewall?). Pemeriksaan sidik jari dilewati."
            elif [ -z "$(comm -12 <(printf '%s\n' "$SIDIK_SECRET") <(printf '%s\n' "$SIDIK_SERVER"))" ]; then
              echo "::error::Tidak ada kunci di SSH_KNOWN_HOSTS yang cocok dengan kunci server saat ini. Buat ulang secret dari server yang benar (tanpa opsi -t, tempel semua baris)."
              echo "Sidik jari di secret:"; echo "$SIDIK_SECRET"
              echo "Sidik jari server saat ini:"; echo "$SIDIK_SERVER"
              exit 1
            else
              echo "Sidik jari server cocok dengan SSH_KNOWN_HOSTS."
            fi
          else
            echo "::warning::Secret SSH_KNOWN_HOSTS belum diisi, sidik jari server tidak diverifikasi."
            ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          fi

      # Pengaman: pastikan path benar sebelum apa pun dikirim, supaya tidak menimpa folder yang salah.
      - name: Cek folder tujuan di server
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "test -f '$APP_PATH/artisan' && test -f '$APP_PATH/.env' && test -f '$PUBLIC_PATH/index.php'"

      # Server tidak punya rsync, jadi paket dikirim sebagai satu berkas tar.gz lewat SSH.
      # .env, storage (foto unggahan, sesi, log), cache bootstrap, dan .git server tidak ikut dikirim.
      - name: Kemas dan kirim paket ke server
        run: |
          set -euo pipefail
          tar -czf /tmp/deploy.tgz --mode='u+rwX,go+rX,go-w' \
            --exclude='./.git' --exclude='./.github' \
            --exclude='./.env' --exclude='./.env.*' \
            --exclude='./node_modules' --exclude='./tests' --exclude='./deploy' \
            --exclude='./storage' \
            --exclude='./bootstrap/cache/*' \
            --exclude='./public/hot' --exclude='./public/storage' \
            --exclude='./database/*.sqlite' \
            --exclude='./.phpunit.result.cache' \
            .
          ls -lh /tmp/deploy.tgz
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'cat > "$HOME/.deploy.tgz"' < /tmp/deploy.tgz

      # Mode pemeliharaan selama kode ditukar dan migrasi jalan (beberapa detik), supaya pengunjung tidak melihat
      # halaman setengah jadi. Bila deploy gagal di tengah, langkah "Pulihkan versi sebelumnya bila deploy gagal" di bawah
      # mengembalikan kode lama dan menaikkan situs lagi.
      - name: Aktifkan mode pemeliharaan
        id: pemeliharaan
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$APP_PATH' && $PHP_BIN artisan down --retry=30"

      # Server memakai dua folder publik: laravel/public (dibaca Vite manifest) dan public_html (yang diakses browser).
      # index.php dan .htaccess di public_html milik server, jadi tidak disentuh.
      - name: Pasang paket di server
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "APP_PATH='$APP_PATH' PUBLIC_PATH='$PUBLIC_PATH' DEPLOY_ID='$DEPLOY_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          STAGE="$HOME/.deploy_stage"
          PREV="$HOME/.deploy_prev"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          tar -xzf "$HOME/.deploy.tgz" -C "$STAGE" --no-same-owner
          test -f "$STAGE/artisan" && test -f "$STAGE/vendor/autoload.php" && test -f "$STAGE/public/build/manifest.json"

          # Cadangan SATU versi sebelumnya (dipakai deploy/pulihkan.sh bila deploy ini gagal). Cadangan deploy
          # sebelumnya diganti. Penanda deploy-id mencegah cadangan lama dipakai oleh deploy yang tidak ada hubungannya.
          rm -rf "$PREV"; mkdir -p "$PREV"
          printf '%s\n' "$DEPLOY_ID" > "$PREV/.deploy_id"
          # Berkas selain folder kode yang akan ditimpa (artisan, composer.*, bootstrap/*.php, public/aset, dll).
          # Berkas yang belum ada di server (baru) dilewati begitu saja.
          (cd "$STAGE" && find . -type f ! -path './app/*' ! -path './config/*' ! -path './database/*' ! -path './resources/*' ! -path './routes/*' ! -path './vendor/*' ! -path './public/build/*' -print0) \
            | tar -C "$APP_PATH" --null -T - --ignore-failed-read -czf "$PREV/lainnya.tgz" 2>/dev/null || echo "Peringatan: cadangan berkas lain tidak lengkap."

          # Folder kode diganti utuh (file lama yang sudah dihapus dari repo ikut hilang). Versi lama dipindah ke
          # cadangan (bukan dihapus) supaya bisa dipulihkan.
          for d in app config database resources routes vendor public/build; do
            mkdir -p "$PREV/$(dirname "$d")"
            if [ -e "$APP_PATH/$d" ]; then mv "$APP_PATH/$d" "$PREV/$d"; fi
            mv "$STAGE/$d" "$APP_PATH/$d"
          done
          # Sisanya (artisan, composer.*, bootstrap/*.php, public/aset, dll) ditimpa; .env dan storage tidak ada di paket.
          cp -a "$STAGE/." "$APP_PATH/"

          # Cache bootstrap buatan komputer lokal memuat paket dev (mis. Pail) yang tidak ada di vendor produksi.
          # Wajib dihapus sebelum artisan jalan; Laravel membuatnya lagi sendiri.
          rm -f "$APP_PATH"/bootstrap/cache/*.php
          rm -f "$APP_PATH/public/hot" "$PUBLIC_PATH/hot"

          # public_html: aset ditimpa, build diganti utuh. index.php dan .htaccess tidak disentuh.
          mkdir -p "$PUBLIC_PATH/aset"
          cp -a "$APP_PATH/public/aset/." "$PUBLIC_PATH/aset/"
          rm -rf "$PUBLIC_PATH/build"
          cp -a "$APP_PATH/public/build" "$PUBLIC_PATH/build"

          rm -rf "$STAGE" "$HOME/.deploy.tgz"
          REMOTE

      - name: Migrasi database dan bersihkan cache
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s <<REMOTE
          set -euo pipefail
          cd '$APP_PATH'
          # public/hot membuat situs mencari aset ke komputer pengembang; wajib tidak ada di server.
          rm -f public/hot '$PUBLIC_PATH/hot'
          $PHP_BIN artisan migrate --force
          $PHP_BIN artisan optimize:clear
          # Simpan config, route, dan view dalam bentuk siap pakai (situs jadi lebih cepat). Aman: kode tidak memakai env() di luar config/.
          $PHP_BIN artisan optimize
          $PHP_BIN artisan up
          REMOTE

      # Cek bahwa situs benar-benar hidup setelah deploy. Gagal di sini membuat deploy dianggap gagal, dan langkah
      # pemulihan di bawah mengembalikan kode lama. Dilewati (dengan peringatan) bila variabel SITE_URL belum diisi.
      - name: Cek situs setelah deploy
        run: |
          set -uo pipefail
          if [ -z "${SITE_URL:-}" ]; then
            echo "::warning::Variabel SITE_URL belum diisi (Settings > Secrets and variables > Actions > Variables), cek otomatis dilewati."
            exit 0
          fi
          base="${SITE_URL%/}"
          for jalur in /up /; do
            kode=000
            for i in 1 2 3 4 5; do
              kode=$(curl -s -L --max-redirs 3 -o /dev/null -w '%{http_code}' --max-time 20 "$base$jalur" || true)
              [ "$kode" = "200" ] && break
              sleep 6
            done
            echo "$base$jalur -> HTTP $kode"
            if [ "$kode" != "200" ]; then
              echo "::error::$base$jalur membalas HTTP $kode setelah deploy."
              exit 1
            fi
          done

      # Jaring pengaman: bila langkah apa pun gagal, kode versi sebelumnya dipulihkan dari cadangan (hanya bila deploy
      # ini sudah sempat mengganti kode di server) dan mode pemeliharaan diangkat lewat penghapusan berkas penanda
      # langsung (tanpa artisan, karena kode baru yang rusak bisa membuat artisan sendiri gagal).
      # Hanya dijalankan bila deploy sudah sampai tahap menyentuh server (mode pemeliharaan sudah dicoba). Gagal lebih
      # awal (mis. verifikasi SSH) tidak mengubah server, jadi tidak ada yang perlu dipulihkan dan tidak ada galat palsu.
      - name: Pulihkan versi sebelumnya bila deploy gagal
        if: failure() && steps.pemeliharaan.outcome != 'skipped'
        run: |
          tr -d '\r' < deploy/pulihkan.sh | ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "APP_PATH='$APP_PATH' PUBLIC_PATH='$PUBLIC_PATH' DEPLOY_ID='$DEPLOY_ID' bash -s" \
            || echo "::error::Pemulihan otomatis gagal. Periksa server secara manual (lihat deploy/pulihkan.sh)."

      - name: Bersihkan kunci SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key